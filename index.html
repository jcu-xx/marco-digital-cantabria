<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marco Digital Cantabria</title>
    <link rel="icon" type="image/jpeg" href="ogo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #000; font-family: 'Montserrat', sans-serif; }
        
        /* CONTENEDOR DE VISOR LOCAL / IFRAME */
        #photo-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #000; }
        iframe { width: 100vw; height: 100vh; border: none; display: block; }

        /* VISOR NATIVO DE CARPETAS LOCALES */
        #local-viewer {
            position: relative; width: 100vw; height: 100vh; display: none; overflow: hidden; background: #000;
        }
        #local-bg {
            position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
            width: calc(100vw + 20px); height: calc(100vh + 20px);
            background-size: cover; background-position: center;
            filter: blur(20px) brightness(0.4); z-index: 1; transform: scale(1.1);
        }
        #local-img {
            position: relative; width: 100%; height: 100%; object-fit: contain; z-index: 2;
        }

        /* ETIQUETA DE FECHA (DEBAJO DEL OJO) */
        #photo-meta {
            position: fixed; bottom: 15px; left: 15px; z-index: 9998;
            color: #ddd; font-size: 0.75rem; background: rgba(0, 0, 0, 0.75);
            padding: 5px 10px; border-radius: 6px; backdrop-filter: blur(4px);
            border: 1px solid rgba(221, 107, 32, 0.3); display: none; pointer-events: none;
            letter-spacing: 0.5px; white-space: nowrap;
        }

        /* --- CARÁTULA DE ENTRADA (SPLASH SCREEN) --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000; z-index: 20000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1s ease-in-out; opacity: 1; cursor: pointer;
        }
        #splash-screen.oculto { opacity: 0; pointer-events: none; }
        
        .splash-logo { 
            width: 160px; height: 160px; object-fit: cover; border-radius: 50%; 
            margin-bottom: 20px; border: 3px solid #dd6b20; 
            box-shadow: 0 0 25px rgba(221, 107, 32, 0.6); background-color: #111; 
        }

        .splash-title { font-family: 'UnifrakturMaguntia', serif; color: #dd6b20; font-size: 3.5rem; margin: 0; text-align: center; text-shadow: 2px 2px 6px rgba(0,0,0,0.9); font-weight: normal; }
        .splash-subtitle { color: #ffffff; font-size: 1.2rem; font-weight: 300; margin-top: 10px; letter-spacing: 3px; text-transform: uppercase; }
        .splash-credits { position: absolute; bottom: 25px; color: #888; font-size: 0.85rem; letter-spacing: 1px; }

        /* ABAJO A LA IZQUIERDA (CONTENEDOR DE MARCA Y VERSIÓN ELEVADO) */
        #brand-container {
            position: fixed; bottom: 45px; left: 15px; z-index: 9999;
            display: flex; align-items: center; gap: 10px;
            background: rgba(0, 0, 0, 0.45); padding: 5px 10px; border-radius: 35px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(221, 107, 32, 0.2);
        }

        #brand-logo {
            width: 45px; height: 45px; border-radius: 50%;
            border: 2px solid #dd6b20; object-fit: cover;
            background-color: #111; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            cursor: pointer; transition: transform 0.2s;
        }
        #brand-logo:hover { transform: scale(1.1); }

        #version-tag {
            color: #dd6b20; font-size: 0.75rem; font-weight: 500;
            background: rgba(0, 0, 0, 0.75); padding: 4px 10px;
            border-radius: 6px; backdrop-filter: blur(6px);
            border: 1px solid rgba(221, 107, 32, 0.3);
            letter-spacing: 1px; white-space: nowrap; margin-right: 5px;
        }

        /* REPRODUCTOR DE MÚSICA (ESQUINA INFERIOR DERECHA) */
        #reproductor-widget {
            position: fixed; bottom: 15px; right: 15px; z-index: 9999;
            display: flex; align-items: center; flex-direction: row-reverse; gap: 8px;
        }
        #btn-toggle-player {
            background: rgba(221, 107, 32, 0.9); backdrop-filter: blur(6px); color: white;
            border: 1px solid rgba(255, 255, 255, 0.3); width: 48px; height: 48px; border-radius: 50%;
            cursor: pointer; font-size: 22px; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); transition: transform 0.2s, background 0.3s;
        }
        #btn-toggle-player:hover { transform: scale(1.08); background: rgba(221, 107, 32, 1); }
        
        #reproductor-panel {
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
            padding: 10px 16px; border-radius: 25px; color: #fff; font-size: 12px;
            display: flex; align-items: center; gap: 10px; border: 1px solid rgba(221, 107, 32, 0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 0; opacity: 0; overflow: hidden; transition: all 0.4s ease-in-out; white-space: nowrap;
        }
        #reproductor-widget.abierto #reproductor-panel { max-width: 400px; opacity: 1; }
        audio { height: 28px; filter: invert(1) hue-rotate(180deg); }
        #info-cancion { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

        /* MODAL DE CONFIGURACIÓN */
        #config-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px);
            z-index: 30000; display: none; justify-content: center; align-items: center;
        }
        #config-modal.abierto { display: flex; }
        .modal-card {
            background: #121215; border: 1px solid rgba(221, 107, 32, 0.4);
            padding: 30px; border-radius: 20px; width: 90%; max-width: 520px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); text-align: left; position: relative;
            max-height: 85vh; overflow-y: auto;
        }
        .modal-card h2 { font-family: 'UnifrakturMaguntia', serif; color: #dd6b20; font-size: 2.2rem; margin-bottom: 20px; text-align: center; margin-top: 0; }
        
        .btn-close-modal {
            position: absolute; top: 15px; right: 20px;
            background: none; border: none; color: #888; font-size: 1.8rem; cursor: pointer;
        }
        .btn-close-modal:hover { color: #fff; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #ccc; }
        
        .input-row { display: flex; gap: 8px; margin-bottom: 6px; width: 100%; box-sizing: border-box; }
        .form-group input[type="text"] {
            flex: 1; width: 0; min-width: 0; padding: 10px 14px; background: #1a1a20; border: 1px solid #444;
            border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; box-sizing: border-box;
            text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
        }
        .form-group input[type="text"]:focus { border-color: #dd6b20; }
        
        .btn-action {
            background: #22222a; border: 1px solid #dd6b20; color: #dd6b20;
            padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; cursor: pointer;
            transition: all 0.2s ease; white-space: nowrap;
        }
        .btn-action:hover { background: #dd6b20; color: #fff; }

        .btn-delete {
            background: #2a1a1a; border: 1px solid #a83232; color: #e57373;
            padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; cursor: pointer;
            transition: all 0.2s ease; white-space: nowrap;
        }
        .btn-delete:hover { background: #a83232; color: #fff; }

        /* ESTILO PARA LOS BOTONES DE FAVORITOS EN LISTA (TV FRIENDLY) */
        .fav-list-container {
            display: flex; flex-direction: column; gap: 4px; max-height: 120px; overflow-y: auto;
            background: #15151a; padding: 6px; border-radius: 8px; border: 1px solid #333;
        }
        .fav-item-btn {
            background: #1a1a20; border: 1px solid #444; color: #ccc;
            padding: 7px 10px; border-radius: 6px; font-size: 0.8rem; text-align: left;
            cursor: pointer; transition: all 0.2s; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
        }
        .fav-item-btn:hover, .fav-item-btn:focus {
            background: #dd6b20; color: #fff; border-color: #dd6b20; outline: none;
        }

        .btn-save {
            width: 100%; padding: 12px; background: #dd6b20; color: #fff; border: none;
            border-radius: 8px; font-size: 1rem; font-weight: 500; cursor: pointer; transition: background 0.2s; margin-top: 15px;
        }
        .btn-save:hover { background: #c05621; }
    </style>
</head>
<body>

    <!-- CARÁTULA DE ENTRADA -->
    <div id="splash-screen" onclick="ocultarSplash()">
        <img src="ogo.jpg" class="splash-logo" alt="Logo" onerror="tratarFallbackImagen(this)">
        <h1 class="splash-title">Marco Digital Cantabria</h1>
        <div class="splash-subtitle" id="splash-version-text">Mirar es volver &bull; </div>
        <div class="splash-credits">Dise&ntilde;ado con Gemini AI por J. C. Ud&iacute;as</div>
    </div>

    <!-- CONTENEDOR HÍBRIDO DE FOTOS -->
    <div id="photo-container">
        <iframe id="photo-iframe" allowfullscreen></iframe>
        <div id="local-viewer">
            <div id="local-bg"></div>
            <img id="local-img" alt="Foto Local">
        </div>
    </div>

    <!-- ETIQUETA DE FECHA (DEBAJO DEL OJO) -->
    <div id="photo-meta"></div>
    
    <!-- CONTENEDOR INFERIOR IZQUIERDO -->
    <div id="brand-container">
        <img src="ogo.jpg" id="brand-logo" alt="Logo / Ajustes" title="Configurar Rutas" onclick="toggleConfigModal()" onerror="tratarFallbackImagen(this)">
        <span id="version-tag"></span>
    </div>

    <!-- REPRODUCTOR DE MÚSICA -->
    <div id="reproductor-widget">
        <button id="btn-toggle-player" title="M&uacute;sica">&#9835;</button>
        <div id="reproductor-panel">
            <span id="info-cancion">Cargando...</span>
            <audio id="audio-player" controls></audio>
        </div>
    </div>

    <!-- MODAL DE CONFIGURACIÓN -->
    <div id="config-modal" onclick="cerrarModalFuera(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="btn-close-modal" onclick="toggleConfigModal()">&times;</button>
            <h2>Ajustes del Marco</h2>
            
            <div class="form-group">
                <label for="input-fotos">Ruta de Fotos (Immich o Carpeta local):</label>
                <div class="input-row">
                    <input type="text" id="input-fotos" placeholder="Ej: http://192.168.1.30:3000 o fotos/">
                    <button class="btn-action" onclick="guardarEnFavoritas('fotos')">Guardar</button>
                    <button class="btn-delete" onclick="borrarFavoritaActual('fotos')">Borrar</button>
                </div>
                <div id="lista-favs-fotos" class="fav-list-container"></div>
            </div>

            <div class="form-group">
                <label for="input-musica">Ruta de M&uacute;sica:</label>
                <div class="input-row">
                    <input type="text" id="input-musica" placeholder="Ej: pistas/">
                    <button class="btn-action" onclick="guardarEnFavoritas('musica')">Guardar</button>
                    <button class="btn-delete" onclick="borrarFavoritaActual('musica')">Borrar</button>
                </div>
                <div id="lista-favs-musica" class="fav-list-container"></div>
            </div>

            <button class="btn-save" onclick="guardarConfiguracion()">Guardar y Aplicar</button>
        </div>
    </div>

    <script>
        var APP_VERSION = "V 4.9";

        document.addEventListener("DOMContentLoaded", function() {
            var splashVersion = document.getElementById("splash-version-text");
            if (splashVersion) {
                splashVersion.innerHTML = "Mirar es volver &bull; " + APP_VERSION;
            }
            var versionTag = document.getElementById("version-tag");
            if (versionTag) {
                versionTag.textContent = APP_VERSION;
            }
        });

        var savedFotos = localStorage.getItem('md_fotos_url') || 'http://192.168.1.30:3000?show_image_date=true&image_date_format=D/M/YYYY';
        var savedMusica = localStorage.getItem('md_musica_url') || 'pistas/';

        var iframeElement = document.getElementById('photo-iframe');
        var localViewer = document.getElementById('local-viewer');
        var localImg = document.getElementById('local-img');
        var localBg = document.getElementById('local-bg');
        var photoMeta = document.getElementById('photo-meta');

        var localPhotosPlaylist = [];
        var photoInterval = null;

        function aplicarRutaFotos(url) {
            if (photoInterval) clearInterval(photoInterval);
            
            if (url.startsWith('http://') || url.startsWith('https://')) {
                localViewer.style.display = 'none';
                photoMeta.style.display = 'none'; // Oculto en Immich para que no estorbe
                iframeElement.style.display = 'block';
                iframeElement.src = url;
            } else {
                iframeElement.style.display = 'none';
                iframeElement.src = '';
                localViewer.style.display = 'block';
                photoMeta.style.display = 'block';
                iniciarVisorLocal(url);
            }
        }

        aplicarRutaFotos(savedFotos);

        async function iniciarVisorLocal(folder) {
            try {
                if (!folder.endsWith('/')) folder += '/';
                var res = await fetch(folder);
                if (!res.ok) return;
                var data = await res.json();
                
                localPhotosPlaylist = data
                    .filter(item => /\.(jpg|jpeg|png|webp)$/i.test(item.name))
                    .map(item => ({
                        name: item.name,
                        date: formatearFechaNginx(item.mtime)
                    }));

                if (localPhotosPlaylist.length > 0) {
                    mostrarSiguienteFotoLocal(folder);
                    if (photoInterval) clearInterval(photoInterval);
                    photoInterval = setInterval(() => {
                        mostrarSiguienteFotoLocal(folder);
                    }, 5000); // 5 segundos de transición
                } else {
                    photoMeta.textContent = "No hay imágenes en " + folder;
                }
            } catch(e) {
                console.error("Error cargando fotos locales:", e);
            }
        }

        function formatearFechaNginx(mtimeStr) {
            if (!mtimeStr) return "";
            try {
                var d = new Date(mtimeStr);
                if (!isNaN(d.getTime())) {
                    return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
                }
            } catch(e) {}
            return "";
        }

        function mostrarSiguienteFotoLocal(folder) {
            if (!localPhotosPlaylist.length) return;
            var randomIndex = Math.floor(Math.random() * localPhotosPlaylist.length);
            var fotoObj = localPhotosPlaylist[randomIndex];
            var fotoUrl = folder + encodeURIComponent(fotoObj.name);

            localImg.src = fotoUrl;
            localBg.style.backgroundImage = 'url("' + fotoUrl + '")';

            // Actualiza dinámicamente la fecha de cada foto en cada ciclo
            var textoMeta = "&#128247; " + (fotoObj.date ? fotoObj.date : "Cantabria");
            photoMeta.innerHTML = textoMeta;
        }

        function toggleConfigModal() {
            var modal = document.getElementById('config-modal');
            if (modal.classList.contains('abierto')) {
                modal.classList.remove('abierto');
                modal.style.display = 'none';
            } else {
                document.getElementById('input-fotos').value = savedFotos;
                document.getElementById('input-musica').value = savedMusica;
                actualizarListaFavoritas();
                modal.style.display = 'flex';
                modal.classList.add('abierto');
            }
        }

        function cerrarModalFuera(event) {
            if (event.target.id === 'config-modal') {
                toggleConfigModal();
            }
        }

        function obtenerFavoritas(tipo) {
            try {
                return JSON.parse(localStorage.getItem('md_fav_' + tipo) || '[]');
            } catch(e) { return []; }
        }

        function guardarEnFavoritas(tipo) {
            var inputVal = document.getElementById(tipo === 'fotos' ? 'input-fotos' : 'input-musica').value.trim();
            if (!inputVal) return;
            
            var favs = obtenerFavoritas(tipo);
            if (!favs.includes(inputVal)) {
                favs.push(inputVal);
                localStorage.setItem('md_fav_' + tipo, JSON.stringify(favs));
                actualizarListaFavoritas();
                alert("¡Ruta guardada en favoritas!");
            }
        }

        function seleccionarFavorita(tipo, ruta) {
            document.getElementById(tipo === 'fotos' ? 'input-fotos' : 'input-musica').value = ruta;
        }

        function borrarFavoritaActual(tipo) {
            var inputVal = document.getElementById(tipo === 'fotos' ? 'input-fotos' : 'input-musica').value.trim();
            
            if (!inputVal) {
                alert("Escribe o selecciona una ruta en el campo superior para borrarla.");
                return;
            }

            var favs = obtenerFavoritas(tipo);
            var nuevasFavs = favs.filter(item => item !== inputVal);
            localStorage.setItem('md_fav_' + tipo, JSON.stringify(nuevasFavs));
            
            document.getElementById(tipo === 'fotos' ? 'input-fotos' : 'input-musica').value = '';
            actualizarListaFavoritas();
            alert("Ruta eliminada de favoritas.");
        }

        function actualizarListaFavoritas() {
            ['fotos', 'musica'].forEach(tipo => {
                var contenedor = document.getElementById(tipo === 'fotos' ? 'lista-favs-fotos' : 'lista-favs-musica');
                var favs = obtenerFavoritas(tipo);
                
                if (tipo === 'fotos' && !favs.includes('http://192.168.1.30:3000?show_image_date=true&image_date_format=D/M/YYYY')) favs.unshift('http://192.168.1.30:3000?show_image_date=true&image_date_format=D/M/YYYY');
                if (tipo === 'fotos' && !favs.includes('fotos/')) favs.unshift('fotos/');
                if (tipo === 'musica' && !favs.includes('pistas/')) favs.unshift('pistas/');

                contenedor.innerHTML = '';
                
                favs.forEach(ruta => {
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'fav-item-btn';
                    btn.textContent = (tipo === 'fotos' ? '📁 ' : '🎵 ') + ruta;
                    btn.onclick = function() {
                        seleccionarFavorita(tipo, ruta);
                    };
                    contenedor.appendChild(btn);
                });
            });
        }

        function guardarConfiguracion() {
            var modal = document.getElementById('config-modal');
            modal.classList.remove('abierto');
            modal.style.display = 'none';

            var nuevaFoto = document.getElementById('input-fotos').value.trim();
            var nuevaMusica = document.getElementById('input-musica').value.trim();

            if (nuevaFoto) {
                savedFotos = nuevaFoto;
                localStorage.setItem('md_fotos_url', savedFotos);
                aplicarRutaFotos(savedFotos);
            }

            if (nuevaMusica) {
                savedMusica = nuevaMusica;
                localStorage.setItem('md_musica_url', savedMusica);
                cargarPlaylist();
            }

            ocultarSplash();
        }

        function tratarFallbackImagen(img) {
            if (img.src.endsWith('ogo.jpg')) { img.src = 'ogo.png'; }
            else if (img.src.endsWith('ogo.png')) { img.src = 'ogo.jpeg'; }
        }

        var audioPlayer = document.getElementById("audio-player");
        var reproduciendoIniciado = false;

        function ocultarSplash() {
            var splash = document.getElementById('splash-screen');
            if (splash && !splash.classList.contains('oculto')) {
                splash.classList.add('oculto');
                setTimeout(function() {
                    splash.style.display = 'none';
                }, 1000);
            }
            if (audioPlayer && !reproduciendoIniciado) {
                audioPlayer.play().then(() => {
                    reproduciendoIniciado = true;
                }).catch(e => console.log("Esperando interacci&oacute;n para audio"));
            }
        }

        setTimeout(ocultarSplash, 3000);

        document.addEventListener('click', function() {
            if (audioPlayer && !reproduciendoIniciado) {
                audioPlayer.play().then(() => {
                    reproduciendoIniciado = true;
                }).catch(e => {});
            }
        }, { once: true });

        try {
            var widget = document.getElementById("reproductor-widget");
            var btnToggle = document.getElementById("btn-toggle-player");
            if (btnToggle) {
                btnToggle.addEventListener("click", function() {
                    widget.classList.toggle("abierto");
                });
            }

            var infoCancion = document.getElementById("info-cancion");
            var playlist = [];
            var currentIndex = 0;

            async function cargarPlaylist() {
                try {
                    var folder = savedMusica;
                    if (!folder.endsWith('/')) folder += '/';

                    var res = await fetch(folder);
                    if (!res.ok) {
                        if (infoCancion) infoCancion.textContent = "Error HTTP " + res.status;
                        return;
                    }
                    var data = await res.json();
                    var encontradas = data
                        .map(function(item) { return item.name; })
                        .filter(function(name) { return name.toLowerCase().endsWith(".mp3"); });

                    if (encontradas.length > 0) {
                        playlist = encontradas;
                        if (infoCancion) infoCancion.textContent = playlist.length + " pistas";
                        cargarCancionAleatoria();
                    } else {
                        if (infoCancion) infoCancion.textContent = "Sin MP3 en carpetas";
                    }
                } catch (e) {
                    console.error(e);
                    if (infoCancion) infoCancion.textContent = "Error leyendo lista";
                }
            }

            function cargarCancionAleatoria() {
                if (!playlist.length) return;
                currentIndex = Math.floor(Math.random() * playlist.length);
                var nombreArchivo = playlist[currentIndex];
                
                if (infoCancion) infoCancion.textContent = nombreArchivo;
                if (audioPlayer) {
                    var folder = savedMusica;
                    if (!folder.endsWith('/')) folder += '/';

                    audioPlayer.src = folder + encodeURIComponent(nombreArchivo);
                    audioPlayer.load();
                    audioPlayer.play().then(() => {
                        reproduciendoIniciado = true;
                    }).catch(function(e) {
                        console.log("Autoplay en espera de interacci&oacute;n");
                    });
                }
            }

            if (audioPlayer) {
                audioPlayer.addEventListener("ended", function() {
                    cargarCancionAleatoria();
                });
            }

            cargarPlaylist();
        } catch(e) {
            console.error("Error en m&oacute;dulo de audio:", e);
        }
    </script>
</body>
</html>
