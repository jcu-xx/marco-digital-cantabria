name: Empaquetar webOS IPK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar archivos para empaquetar
        run: |
          mkdir build_app
          cp index.html appinfo.json icon.png build_app/

      - name: Empaquetar con la herramienta oficial de LG
        run: |
          npm install -g @webos-tools/cli
          ares-package build_app

      - name: Subir el archivo IPK resultante
        uses: actions/upload-artifact@v4
        with:
          name: marco-digital-ipk
          path: '*.ipk'
